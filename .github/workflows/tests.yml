# Full suite on macOS: helper trust checks use BSD `stat -f` and the product
# depends on macOS commands (docs/consults/test-architecture.md). Runs WITHOUT
# root/sudo and without network: real sudoers install, Keychain prompts and
# live VPN are manual-only.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ShellCheck
        run: command -v shellcheck >/dev/null || brew install shellcheck
      - name: Run test suite
        run: tests/run-tests.sh
